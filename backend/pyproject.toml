[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for structured AI-assisted code reviews."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.40,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
